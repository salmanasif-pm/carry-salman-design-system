<!-- @dsCard group="States" viewport="700x150" name="Axis A — certainty (fill)" subtitle="What do we know? Confirmed · Provisional · Unknown; Superseded for operating history only. Fill, so it survives greyscale and print" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;display:flex;flex-direction:column;gap:12px;box-sizing:border-box;height:150px;overflow:hidden}.row{display:flex;gap:10px;align-items:stretch}.lbl{font:400 var(--text-label)/1 var(--font-truth);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--ink-3)}.mk{width:14px;height:14px;display:inline-block;vertical-align:-2px;margin-right:8px;flex:none;position:relative;box-sizing:border-box}</style></head><body><div class="row" style="gap:24px;font:400 var(--text-truth)/1.5 var(--font-truth)">
<div><span class="mk" style="background:var(--ink)"></span>Confirmed<div class="lbl" style="margin:6px 0 0 22px">solid · verified</div></div>
<div><span class="mk" style="border:1.5px solid var(--ink)"></span>Provisional<div class="lbl" style="margin:6px 0 0 22px">outline · may change</div></div>
<div><span class="mk" style="background:var(--fill-unknown)"></span>Unknown<div class="lbl" style="margin:6px 0 0 22px">hatched · not known, said so</div></div>
<div><span class="mk" style="background:var(--ink-4)"></span>Superseded<div class="lbl" style="margin:6px 0 0 22px">faded · operating history only</div></div></div>
<div class="lbl">unknown stays unknown · confirmed never by visual confidence alone</div></body></html>

<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;display:flex;flex-direction:column;gap:12px;box-sizing:border-box;height:170px;overflow:hidden}.row{display:flex;gap:10px;align-items:stretch}.sw{flex:1;min-width:0;height:70px;display:flex;align-items:flex-end;padding:8px;font:400 11px/1.3 var(--font-truth);color:var(--ink-3)}.lbl{font:400 var(--text-label)/1 var(--font-truth);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--ink-3)}.mk{width:14px;height:14px;display:inline-block;vertical-align:-2px;margin-right:8px;flex:none}</style></head><body><div class="row" style="flex-wrap:wrap;gap:8px 24px;font:400 var(--text-truth)/1.5 var(--font-truth)"><div style="flex:0 0 calc(33% - 16px)"><b style="font-weight:500">attract</b> <span style="color:var(--ink-3)">480ms</span><br><span style="color:var(--ink-2)">handle fades in, 8px rise</span></div><div style="flex:0 0 calc(33% - 16px)"><b style="font-weight:500">orient</b> <span style="color:var(--ink-3)">320ms</span><br><span style="color:var(--ink-2)">rule draws left→right, tick lands</span></div><div style="flex:0 0 calc(33% - 16px)"><b style="font-weight:500">confirm</b> <span style="color:var(--ink-3)">160ms</span><br><span style="color:var(--ink-2)">outline → solid fill</span></div><div style="flex:0 0 calc(33% - 16px)"><b style="font-weight:500">progress</b> <span style="color:var(--ink-3)">640ms</span><br><span style="color:var(--ink-2)">ladder steps, 80ms stagger</span></div><div style="flex:0 0 calc(33% - 16px)"><b style="font-weight:500">converge</b> <span style="color:var(--ink-3)">480ms</span><br><span style="color:var(--ink-2)">truth rows align under decision</span></div><div style="flex:0 0 calc(33% - 16px)"><b style="font-weight:500">release</b> <span style="color:var(--ink-3)">240ms</span><br><span style="color:var(--ink-2)">handoff footer, last</span></div></div></body></html>

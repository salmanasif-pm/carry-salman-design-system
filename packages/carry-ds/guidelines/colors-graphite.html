<!-- @dsCard group="Colors" viewport="700x150" name="Graphite ground" subtitle="Dark is a transition, a closer, or personal mode — never the default and never a credibility shortcut" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;display:flex;flex-direction:column;gap:12px;box-sizing:border-box;height:150px;overflow:hidden}.row{display:flex;gap:10px;align-items:stretch}.sw{flex:1;min-width:0;height:70px;display:flex;align-items:flex-end;padding:8px;font:400 11px/1.3 var(--font-truth);color:var(--ink-3)}.lbl{font:400 var(--text-label)/1 var(--font-truth);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--ink-3)}.mk{width:14px;height:14px;display:inline-block;vertical-align:-2px;margin-right:8px;flex:none}</style></head><body><div class="row" data-carry-ground="graphite" style="background:var(--carry-graphite-0);padding:10px;margin:-6px"><div class="sw" style="background:var(--carry-graphite-0);color:var(--carry-paper-1)">graphite-0</div><div class="sw" style="background:var(--carry-graphite-1);color:var(--carry-paper-1)">graphite-1</div><div class="sw" style="background:var(--carry-graphite-2);color:var(--carry-ink-2)">graphite-2</div><div class="sw" style="background:var(--carry-graphite-3);color:var(--carry-ink-2)">graphite-3</div><div class="sw" style="background:var(--carry-graphite-ink-3);color:var(--carry-ink-2)">graphite-ink-3</div><div class="sw" style="background:var(--carry-graphite-ink-2);color:var(--carry-ink-2)">graphite-ink-2</div><div class="sw" style="background:var(--carry-graphite-ink);color:var(--carry-ink-2)">graphite-ink</div><div class="sw" style="background:var(--carry-ochre-1);color:var(--carry-graphite-0)">ochre-1 (signal on dark)</div></div></body></html>

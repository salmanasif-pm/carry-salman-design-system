<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;display:flex;flex-direction:column;gap:12px;box-sizing:border-box;height:190px;overflow:hidden}.row{display:flex;gap:10px;align-items:stretch}.sw{flex:1;min-width:0;height:70px;display:flex;align-items:flex-end;padding:8px;font:400 11px/1.3 var(--font-truth);color:var(--ink-3)}.lbl{font:400 var(--text-label)/1 var(--font-truth);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--ink-3)}.mk{width:14px;height:14px;display:inline-block;vertical-align:-2px;margin-right:8px;flex:none}</style></head><body><div class="row" style="flex-wrap:wrap;gap:8px"><div class="sw" style="flex:0 0 calc(20% - 7px);height:56px;background:var(--ground);color:var(--carry-ink-2);border:1px solid var(--rule)">ground</div><div class="sw" style="flex:0 0 calc(20% - 7px);height:56px;background:var(--surface);color:var(--carry-ink-2);border:1px solid var(--rule)">surface</div><div class="sw" style="flex:0 0 calc(20% - 7px);height:56px;background:var(--surface-sunken);color:var(--carry-ink-2);border:1px solid var(--rule)">sunken</div><div class="sw" style="flex:0 0 calc(20% - 7px);height:56px;background:var(--rule);color:var(--carry-ink-2);border:1px solid var(--rule)">rule</div><div class="sw" style="flex:0 0 calc(20% - 7px);height:56px;background:var(--ink);color:var(--carry-paper-1);border:1px solid var(--rule)">ink</div><div class="sw" style="flex:0 0 calc(20% - 7px);height:56px;background:var(--ink-2);color:var(--carry-paper-1);border:1px solid var(--rule)">ink-2 / evidence</div><div class="sw" style="flex:0 0 calc(20% - 7px);height:56px;background:var(--ink-3);color:var(--carry-ink-2);border:1px solid var(--rule)">ink-3</div><div class="sw" style="flex:0 0 calc(20% - 7px);height:56px;background:var(--signal);color:var(--carry-paper-1);border:1px solid var(--rule)">signal</div><div class="sw" style="flex:0 0 calc(20% - 7px);height:56px;background:var(--signal-subtle);color:var(--carry-ink-2);border:1px solid var(--rule)">signal-subtle</div><div class="sw" style="flex:0 0 calc(20% - 7px);height:56px;background:var(--warmth);color:var(--carry-ink-2);border:1px solid var(--rule)">warmth</div><div class="sw" style="flex:0 0 calc(20% - 7px);height:56px;background:var(--constraint);color:var(--carry-paper-1);border:1px solid var(--rule)">constraint</div></div><div class="lbl">state is never a colour role · constraint is ink, never red · risk is shown by a bar, not alarm</div></body></html>

<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;display:flex;flex-direction:column;gap:12px;box-sizing:border-box;height:150px;overflow:hidden}.row{display:flex;gap:10px;align-items:stretch}.sw{flex:1;min-width:0;height:70px;display:flex;align-items:flex-end;padding:8px;font:400 11px/1.3 var(--font-truth);color:var(--ink-3)}.lbl{font:400 var(--text-label)/1 var(--font-truth);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--ink-3)}.mk{width:14px;height:14px;display:inline-block;vertical-align:-2px;margin-right:8px;flex:none}</style></head><body><div class="row"><div class="sw" style="background:var(--carry-paper-0);color:var(--carry-ink-2)">paper-0</div><div class="sw" style="background:var(--carry-paper-1);color:var(--carry-ink-2)">paper-1</div><div class="sw" style="background:var(--carry-paper-2);color:var(--carry-ink-2)">paper-2</div><div class="sw" style="background:var(--carry-paper-3);color:var(--carry-ink-2)">paper-3</div><div class="sw" style="background:var(--carry-ink-4);color:var(--carry-ink-2)">ink-4</div><div class="sw" style="background:var(--carry-ink-3);color:var(--carry-ink-2)">ink-3</div><div class="sw" style="background:var(--carry-ink-2);color:var(--carry-ink-2)">ink-2</div><div class="sw" style="background:var(--carry-ink-1);color:var(--carry-paper-1)">ink-1</div><div class="sw" style="background:var(--carry-ink-0);color:var(--carry-paper-1)">ink-0</div></div><div class="lbl">paper-1 is the default ground · ink-0 is the default voice · 14.6:1</div></body></html>

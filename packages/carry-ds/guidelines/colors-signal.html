<!-- @dsCard group="Colors" viewport="700x150" name="Signal — one ochre" subtitle="The only hue. It marks exactly one thing per artifact: the threshold tick, and by extension the decision" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;display:flex;flex-direction:column;gap:12px;box-sizing:border-box;height:150px;overflow:hidden}.row{display:flex;gap:10px;align-items:stretch}.sw{flex:1;min-width:0;height:70px;display:flex;align-items:flex-end;padding:8px;font:400 11px/1.3 var(--font-truth);color:var(--ink-3)}.lbl{font:400 var(--text-label)/1 var(--font-truth);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--ink-3)}.mk{width:14px;height:14px;display:inline-block;vertical-align:-2px;margin-right:8px;flex:none}</style></head><body><div class="row"><div class="sw" style="background:var(--carry-ochre-0);color:var(--carry-ink-2)">ochre-0</div><div class="sw" style="background:var(--carry-ochre-1);color:var(--carry-ink-2)">ochre-1</div><div class="sw" style="background:var(--carry-ochre-2);color:var(--carry-paper-1)">ochre-2</div><div class="sw" style="background:var(--carry-ochre-3);color:var(--carry-paper-1)">ochre-3</div><div class="sw" style="background:var(--carry-ochre-4);color:var(--carry-paper-1)">ochre-4</div></div><div class="lbl">ochre-2 = --signal (marks) · ochre-3 = --signal-text (AA 5.3:1 on paper-1) · never a wash, never a background</div></body></html>

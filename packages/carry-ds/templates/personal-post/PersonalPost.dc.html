<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Personal post" description="1080×1350 personal / training post on graphite. Intention / reflection form, small tick. Mobile-readable. Documentary photo slot; warmer voice allowed." -->
<helmet><script src="./ds-base.js"></script><script src="./image-slot.js"></script></helmet>
<div data-carry-mode="personal" data-carry-ground="graphite" data-screen-label="Personal post" style="width:1080px;height:1350px;background:#1D1F22;color:#EFE9DF;font-family:'Instrument Sans',system-ui,sans-serif;display:flex;flex-direction:column;position:relative;box-sizing:border-box">
<div style="height:560px;background:#26282C;position:relative">
<image-slot id="personal-post-photo" shape="rect" placeholder="Documentary photo — training, working or thinking. Natural light. No posed lift." style="position:absolute;inset:0"></image-slot></div>
<div style="padding:64px 80px 80px;display:flex;flex-direction:column;flex:1">
<div style="font:400 24px/1 'Geist Mono',monospace;color:#8A8478">the plan said</div>
<div style="margin-top:20px;font:500 84px/1 'Instrument Sans',sans-serif;letter-spacing:-.035em">Add five kilos.</div>
<div style="position:relative;height:4px;background:#EFE9DF;margin:44px 0 36px"><span style="position:absolute;left:0;top:-5px;width:14px;height:14px;background:#E8B989"></span></div>
<div style="font:400 24px/1 'Geist Mono',monospace;color:#8A8478">what actually happened</div>
<div style="margin-top:20px;font:400 40px/1.4 'Instrument Sans',sans-serif;color:#EFE9DF;text-wrap:pretty">Same weight. One more clean rep. Form held when it got hard — and that's the number I was actually training for.</div>
<div style="margin-top:auto;font:500 40px/1.3 'Instrument Sans',sans-serif;letter-spacing:-.01em;color:#EFE9DF;text-wrap:pretty"><span style="color:#E8B989">Kept: </span>the plan gets the five kilos when the form says so. Same as any roadmap, honestly.</div>
<div style="display:flex;justify-content:space-between;align-items:flex-end;margin-top:36px"><span style="font:500 30px/1 'Instrument Sans',sans-serif;letter-spacing:-.02em;color:#EFE9DF;position:relative;padding-bottom:10px;border-bottom:4px solid #EFE9DF">Salman Asif<span style="position:absolute;left:0;bottom:-10px;width:14px;height:14px;background:#E8B989"></span></span><span style="font:400 24px/1 'Geist Mono',monospace;color:#8A8478">training log</span></div>
</div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1080,&quot;height&quot;:1350}}"></script>
</body>
</html>

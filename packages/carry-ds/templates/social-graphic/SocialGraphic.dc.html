<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Social graphic" description="1080×1080 LinkedIn graphic, mobile-readable: headline ≤ 108px, evidence ≥ 40px source (≥ 13px at 360px display). Claim/support form. Metadata lives in the caption." -->
<helmet><script src="./ds-base.js"></script></helmet>
<div data-carry-mode="social" data-carry-ground="{{ ground }}" data-screen-label="Social graphic" style="width:1080px;height:1080px;background:var(--ground,#EFE9DF);color:var(--ink,#17181A);padding:80px;box-sizing:border-box;display:flex;flex-direction:column;font-family:'Instrument Sans',system-ui,sans-serif;position:relative">
<div style="flex:1;display:flex;align-items:flex-end;font:500 100px/1 'Instrument Sans',sans-serif;letter-spacing:-.035em;padding-bottom:48px;text-wrap:balance">Users don't want a chatbot. They want the answer.</div>
<div style="position:relative;height:5px;background:var(--rule-strong,#17181A)"><span style="position:absolute;left:0;top:-11px;width:26px;height:26px;border:5px solid var(--signal,#B8641C);box-sizing:border-box"></span></div>
<div style="margin-top:44px;font:400 40px/1.4 'Geist Mono',monospace;display:grid;grid-template-columns:auto 1fr;gap:18px 24px;align-items:start">
<span style="width:26px;height:26px;margin-top:14px;background:var(--ink,#17181A)"></span><span>Three support flows. One question in all of them: "where is my order?"</span>
<span style="width:26px;height:26px;margin-top:14px;border:4px solid var(--ink,#17181A);box-sizing:border-box"></span><span>Voice and chat were the packaging. The status lookup was the product.</span>
</div>
<div style="margin-top:auto;font:500 46px/1.25 'Instrument Sans',sans-serif;letter-spacing:-.015em;text-wrap:pretty"><span style="color:var(--signal-text,#8C4A12)">So: </span>build the lookup first. Add conversation where it earns its place.</div>
<div style="display:flex;justify-content:space-between;align-items:flex-end;margin-top:44px"><span style="font:500 30px/1 'Instrument Sans',sans-serif;letter-spacing:-.02em;color:var(--ink,#17181A);position:relative;padding-bottom:10px;border-bottom:4px solid var(--rule-strong,#17181A)">Salman Asif<span style="position:absolute;left:0;bottom:-10px;width:14px;height:14px;background:var(--signal,#B8641C)"></span></span><span style="font:400 24px/1 'Geist Mono',monospace;color:var(--ink-3,#6E685C)">illustrative example</span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1080,&quot;height&quot;:1080},&quot;ground&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;paper&quot;,&quot;graphite&quot;],&quot;default&quot;:&quot;paper&quot;,&quot;tsType&quot;:&quot;'paper' | 'graphite'&quot;,&quot;section&quot;:&quot;Mode&quot;}}">
class Component extends DCLogic {
  renderVals() { return { ground: this.props.ground ?? 'paper' }; }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Carry — thumbnail</title>
<link rel="stylesheet" href="styles.css">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500&display=swap" rel="stylesheet">
<style>html,body{margin:0;width:1280px;height:854px;overflow:hidden}
.t{display:grid;grid-template-columns:960px 320px;width:1280px;height:854px}
.main{background:var(--carry-paper);color:var(--carry-ink);display:flex;align-items:center;justify-content:center;font:500 240px/1 var(--font-handle);letter-spacing:-.04em}
.strip{display:grid;grid-template-rows:repeat(4,1fr)}
.strip div:nth-child(1){background:var(--carry-ochre-pale)}.strip div:nth-child(2){background:var(--carry-ochre)}.strip div:nth-child(3){background:var(--carry-ochre-deep)}.strip div:nth-child(4){background:var(--carry-ink)}</style></head>
<body><div class="t"><div class="main">Carry</div><div class="strip"><div></div><div></div><div></div><div></div></div></div></body></html>
